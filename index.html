<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <!-- the 128 px mark (6 KB): the full-size logo.webp was a 100 KB download racing the hero -->
    <link rel="icon" type="image/webp" href="/src/assets/icons/sources/IconLogo-128.webp"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

    <!-- Defaults for first paint; useSeo.ts replaces these per route. -->
    <meta
            name="title"
            content="Mysterria - Lord of the Mysteries Minecraft Server | Pathways, Potions, Sequences"
    />
    <meta
            name="description"
            content="A Lord of the Mysteries Minecraft server with the full Beyonder system: 22 Pathways, brewing, rituals and the Sequence 9 to 0 climb. Java and Bedrock, free to join, in English, Ukrainian and Chinese."
    />
    <link rel="canonical" href="https://mysterria.net/"/>
    <meta name="theme-color" content="#05070a"/>
    <!-- Saved light/dark choice (src/composables/useTheme.ts), applied before the first
         paint so a light-mode visitor never sees the dark page flash first. Dark by default. -->
    <script>
        (function () {
            var theme = "dark";
            try {
                if (localStorage.getItem("myst-theme") === "parchment") theme = "parchment";
            } catch (e) {}
            document.documentElement.dataset.theme = theme;
            if (theme === "parchment") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#efede8");
        })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website"/>
    <meta property="og:site_name" content="Mysterria"/>
    <meta property="og:url" content="https://mysterria.net/"/>
    <meta
            property="og:title"
            content="Mysterria - Lord of the Mysteries Minecraft Server"
    />
    <meta
            property="og:description"
            content="Drink the potion. Act the role. Climb 22 Beyonder Pathways from Sequence 9 toward godhood on a Lord of the Mysteries Minecraft server."
    />
    <meta property="og:image" content="https://mysterria.net/banner.webp"/>
    <meta property="og:image:width" content="1200"/>
    <meta property="og:image:height" content="630"/>
    <meta property="og:image:alt" content="Mysterria - a Lord of the Mysteries Minecraft server"/>
    <meta property="og:locale" content="en_US"/>
    <meta property="og:locale:alternate" content="uk_UA"/>
    <meta property="og:locale:alternate" content="zh_TW"/>
    <meta property="og:locale:alternate" content="zh_CN"/>

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image"/>
    <meta name="twitter:url" content="https://mysterria.net/"/>
    <meta
            name="twitter:title"
            content="Mysterria - Lord of the Mysteries Minecraft Server"
    />
    <meta
            name="twitter:description"
            content="Drink the potion. Act the role. Climb 22 Beyonder Pathways from Sequence 9 toward godhood on a Lord of the Mysteries Minecraft server."
    />
    <meta name="twitter:image" content="https://mysterria.net/banner.webp"/>

    <!-- Fonts: Commissioner and the icon subset are self-hosted (src/assets/arcana.css, main.ts).
         Every locale sets Latin (digits, the brand, buttons), so that subset is fetched with the
         page instead of after the app has rendered text: the copy swaps in before the first paint
         or soon after it. -->
    <link rel="preload" href="/src/assets/fonts/commissioner/commissioner-latin.woff2" as="font" type="font/woff2" crossorigin>

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://api.mysterria.net">
    <link rel="preconnect" href="https://catwalk.mysterria.net">

    <title>Mysterria - Lord of the Mysteries Minecraft Server</title>
</head>
<body>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
<!-- Declared statically so it survives without JS; useSeo references these @ids. -->
<script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@graph": [
            {
                "@type": "Organization",
                "@id": "https://mysterria.net/#organization",
                "name": "Mysterria",
                "url": "https://mysterria.net/",
                "logo": "https://mysterria.net/logo.webp",
                "description": "Mysterria is a Lord of the Mysteries inspired Minecraft server with a custom Beyonder system: 22 Pathways, potions, rituals and a Sequence 9 to 0 climb.",
                "sameAs": [
                    "https://discord.com/invite/jc7GSxBWgb",
                    "https://wiki.mysterria.net/",
                    "https://map.mysterria.net/",
                    "https://docs.mysterria.net/",
                    "https://github.com/ikeepcalm/coi-client",
                    "https://modrinth.com/mod/coi-client",
                    "https://www.curseforge.com/minecraft/mc-mods/coi-client"
                ]
            },
            {
                "@type": "WebSite",
                "@id": "https://mysterria.net/#website",
                "url": "https://mysterria.net/",
                "name": "Mysterria",
                "alternateName": "Mysterria Minecraft Server",
                "inLanguage": [
                    "en",
                    "uk"
                ],
                "publisher": {
                    "@id": "https://mysterria.net/#organization"
                }
            }
        ]
    }
</script>
</body>
</html>
