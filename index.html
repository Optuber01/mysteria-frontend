<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/logo-mark.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <meta
      name="title"
      content="Mysterria – Lord of The Mysteries Minecraft Server | Potions, Sequences, Pathways"
    />
    <meta
      name="description"
      content="Mysterria – A unique Minecraft server inspired by the Lord of the Mysteries web novel. Explore mystical Pathways, brew Potions, advance through Sequences, and immerse yourself in a world of gods and churches. English and Ukrainian support."
    />
    <meta
      name="keywords"
      content="minecraft, Lord of the Mysteries, Mysterria, mystical minecraft, potions, sequences, pathways, gods, churches, magic, beyonder, mysticism, occultism, roleplay server"
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mysterria.net/" />
    <meta
      property="og:title"
      content="Mysterria – Lord of The Mysteries Minecraft Server | Mystical Adventures"
    />
    <meta
      property="og:description"
      content="Dive into the world of Lord of the Mysteries! A unique Minecraft server with Potions, Sequences, Pathways, and mystical adventures. English and Ukrainian support."
    />
    <meta property="og:image" content="/banner.webp" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://mysterria.net/" />
    <meta
      property="twitter:title"
      content="Mysterria – Lord of The Mysteries Minecraft Server | Mystical Adventures"
    />
    <meta
      property="twitter:description"
      content="Dive into the world of Lord of the Mysteries! A unique Minecraft server with Potions, Sequences, Pathways, and mystical adventures. English and Ukrainian support."
    />
    <meta property="twitter:image" content="/banner.webp" />

    <!-- Preload critical resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="//cdnjs.cloudflare.com">

    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    >
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    </noscript>
    
    <!-- Preload the homepage LCP image. Vite fingerprints this source at build time. -->
    <link rel="preload" as="image" type="image/webp" href="/src/assets/images/home/mysterria-dawn.webp">
    <link rel="preload" as="font" type="font/woff2" href="/fonts/ibm-plex-sans-condensed-700-latin.woff2" crossorigin>
    
    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://api.mysterria.net">
    <link rel="preconnect" href="https://catwalk.mysterria.net">
    
    <!-- Critical CSS for font loading optimization -->
    <style>
      @font-face {
        font-family: "IBM Plex Sans Condensed";
        font-style: normal;
        font-weight: 700;
        font-display: optional;
        src: url("/fonts/ibm-plex-sans-condensed-700-latin.woff2") format("woff2");
      }
      /* Mysterria typography */
      :root {
        --font-primary: "Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --font-display: "IBM Plex Sans Condensed", "Arial Narrow", sans-serif;
      }
      
      body { 
        font-family: var(--font-primary);
        font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      }
    </style>
    
    <!-- No custom font loading script needed - Inter loads fast with display=swap -->

    <title>Mysterria - Lord of The Mysteries Minecraft Server</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Mysterria - Lord of The Mysteries Minecraft Server",
        "alternateName": "Mysterria",
        "description": "Lord of The Mysteries inspired Minecraft server with Potions, Sequences, Pathways, and mystical adventures",
        "url": "https://mysterria.net/",
        "potentialAction": {
          "@type": "SearchAction",
          "target": "https://mysterria.net/search?q={search_term_string}",
          "query-input": "required name=search_term_string"
        },
        "sameAs": [
          "https://docs.mysterria.net/",
          "https://map.mysterria.net/"
        ]
      }
    </script>
    <style>
      /* body {
			width: 1400px;
			margin: auto;
		} */
    </style>
  </body>
</html>
